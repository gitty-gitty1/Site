<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Offline Blog</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: auto;
      background: #f5f5f5;
    }
    h1 { text-align: center; }
    input, textarea, button {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      font-size: 16px;
    }
    .post {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .date {
      font-size: 12px;
      color: gray;
    }
    .tags {
      font-size: 13px;
      color: #007acc;
      margin-top: 5px;
    }
    .controls {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .controls button {
      margin-left: 5px;
      padding: 5px 10px;
      font-size: 12px;
    }
    #search {
      margin-bottom: 20px;
      padding: 10px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>My Offline Blog</h1>

  <input type="text" id="title" placeholder="Post title" />
  <textarea id="content" rows="5" placeholder="Write your post..."></textarea>
  <input type="text" id="tags" placeholder="Tags (comma-separated)" />
  <button onclick="addOrUpdatePost()">Save Post</button>

  <input type="text" id="search" placeholder="Search posts..." oninput="displayPosts()" />

  <div id="posts"></div>

  <script>
    let posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
    let editIndex = null;

    function savePosts() {
      localStorage.setItem('blogPosts', JSON.stringify(posts));
    }

    function displayPosts() {
      const postsDiv = document.getElementById('posts');
      const search = document.getElementById('search').value.toLowerCase();
      postsDiv.innerHTML = '';

      posts.slice().reverse().forEach((post, reversedIndex) => {
        const index = posts.length - 1 - reversedIndex;

        if (
          post.title.toLowerCase().includes(search) ||
          post.content.toLowerCase().includes(search) ||
          (post.tags && post.tags.toLowerCase().includes(search))
        ) {
          const div = document.createElement('div');
          div.className = 'post';
          div.innerHTML = `
            <div class="controls">
              <button onclick="editPost(${index})">Edit</button>
              <button onclick="deletePost(${index})">Delete</button>
            </div>
            <h3>${post.title}</h3>
            <div class="date">${post.date}</div>
            <p>${post.content.replace(/\n/g, "<br>")}</p>
            <div class="tags">${post.tags ? 'Tags: ' + post.tags : ''}</div>
          `;
          postsDiv.appendChild(div);
        }
      });
    }

    function addOrUpdatePost() {
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();
      const tags = document.getElementById('tags').value.trim();

      if (!title || !content) return alert("Title and content are required!");

      const newPost = {
        title,
        content,
        tags,
        date: new Date().toLocaleString()
      };

      if (editIndex !== null) {
        posts[editIndex] = newPost;
        editIndex = null;
      } else {
        posts.push(newPost);
      }

      savePosts();
      displayPosts();
      clearForm();
    }

    function deletePost(index) {
      if (confirm("Delete this post?")) {
        posts.splice(index, 1);
        savePosts();
        displayPosts();
      }
    }

    function editPost(index) {
      const post = posts[index];
      document.getElementById('title').value = post.title;
      document.getElementById('content').value = post.content;
      document.getElementById('tags').value = post.tags || '';
      editIndex = index;
      window.scrollTo(0, 0);
    }

    function clearForm() {
      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      document.getElementById('tags').value = '';
    }

    displayPosts();
  </script>
</body>
</html>
